<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>⏱ 과학토론타이머</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="clock">
  <div class="clock-drag-bar"></div>
  <button class="clock-close-x" id="btnClose" title="닫기 (Esc)">✕</button>
  <div class="fs-hint" id="fsHint">Enter 또는 Esc 키로 전체화면 해제</div>
  <div class="main-view">
    <div class="top">
      <div class="stage" id="stage" data-kind="present">자기주장 발표</div>
      <div class="count" id="count">단계 1 / 25</div>
    </div>
    <div class="detail" id="detail">1팀 발표</div>
    <div class="timer-wrap"><div class="timer" id="timer">05:00</div></div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="next" id="next">다음 ▶ 준비 시간 · 2팀 발표 준비</div>
  </div>
  <script src="clock.js"></script>
</body>
</html>
