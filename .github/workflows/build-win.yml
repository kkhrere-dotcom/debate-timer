name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.html'
      - '**.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-win.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win
        env:
          # 서명 안 함 (Developer ID 없음). SmartScreen 경고는 사용자가 수동 통과.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build output
        shell: pwsh
        run: |
          Write-Host "=== dist 폴더 내용 ==="
          Get-ChildItem dist -Recurse -File | Where-Object { $_.Length -gt 1MB } | Select-Object FullName, @{N='Size(MB)';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: debate-timer-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload unpacked (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debate-timer-windows-unpacked-failed
          path: dist/win-unpacked/
          if-no-files-found: ignore
          retention-days: 7
